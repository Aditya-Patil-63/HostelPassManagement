# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true

# If your build fails with an error about a missing `jlink.exe` (for example:
# "jlink executable ... does not exist"), Gradle/AGP is using a Java runtime
# that does not include the `jlink` tool (often a JRE or a VS Code/extension-provided
# runtime). Point Gradle to a full JDK that contains `jlink` by setting
# `org.gradle.java.home` to your JDK installation directory below.
#
# Example (uncomment and update to the absolute path of a full JDK on your machine):
# org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.8
#
# After setting that, re-run the Gradle build. You can also permanently set
# the system JAVA_HOME environment variable to the same JDK.
# Set the project Gradle JVM to a full JDK that contains jlink.exe. Updated to use the
# JDK detected on this machine (D:). If this path is different on your system,
# replace it with the absolute JDK root that contains a `bin` folder.
org.gradle.java.home=D\:/Program Files/jbr
